<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>盤老板海鮮水產｜訂單查詢</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    padding: 20px;

    background: #f4f6f8;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Microsoft JhengHei",
        Arial,
        sans-serif;

    color: #333;
}


.container {

    width: 100%;

    max-width: 520px;

    margin: 0 auto;
}


/* =========================
   標題
========================= */

.header {

    text-align: center;

    padding: 25px 10px 20px;

}

.logo {

    font-size: 48px;

}

h1 {

    margin: 8px 0 5px;

    font-size: 27px;

}

.subtitle {

    color: #777;

    font-size: 15px;

}


/* =========================
   查詢區
========================= */

.search-card {

    background: white;

    border-radius: 18px;

    padding: 24px;

    box-shadow:
        0 5px 20px rgba(0,0,0,0.08);

}


.search-title {

    font-size: 20px;

    font-weight: bold;

    margin-bottom: 8px;

}


.search-description {

    color: #777;

    font-size: 14px;

    line-height: 1.6;

    margin-bottom: 20px;

}


label {

    display: block;

    font-weight: bold;

    margin-bottom: 8px;

}


input {

    width: 100%;

    padding: 14px;

    border:

        1px solid #d9d9d9;

    border-radius: 10px;

    font-size: 17px;

    outline: none;

    margin-bottom: 12px;

}


input:focus {

    border-color: #333;

}


button {

    width: 100%;

    padding: 14px;

    border: none;

    border-radius: 10px;

    background: #222;

    color: white;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;

}


/* =========================
   搜尋結果
========================= */

#searchResults {

    margin-top: 20px;

}


.search-count {

    margin-bottom: 10px;

    color: #777;

    font-size: 14px;

}


.customer-button {

    width: 100%;

    background: white;

    color: #222;

    border: none;

    border-radius: 14px;

    padding: 18px;

    margin-bottom: 10px;

    text-align: left;

    box-shadow:
        0 4px 15px rgba(0,0,0,0.06);

    cursor: pointer;

}


.customer-button:hover {

    transform: translateY(-1px);

}


.customer-icon {

    font-size: 22px;

    margin-right: 8px;

}


.customer-id {

    font-size: 18px;

    font-weight: bold;

}


/* =========================
   訂單區
========================= */

#orderPage {

    display: none;

    margin-top: 20px;

}


.back-button {

    background: transparent;

    color: #555;

    border: none;

    text-align: left;

    padding: 5px 0 15px;

    font-size: 15px;

}


.customer-header {

    background: white;

    border-radius: 15px;

    padding: 20px;

    margin-bottom: 15px;

    box-shadow:
        0 4px 15px rgba(0,0,0,0.06);

}


.customer-header-title {

    font-size: 21px;

    font-weight: bold;

}


.customer-header-subtitle {

    color: #777;

    margin-top: 5px;

    font-size: 14px;

}


/* =========================
   分類標題
========================= */

.section-title {

    padding: 13px 15px;

    border-radius: 12px;

    margin-top: 15px;

    margin-bottom: 10px;

    font-weight: bold;

}


.arrived-title {

    background: #e8f7ed;

    color: #16803c;

}


.waiting-title {

    background: #eef1f4;

    color: #66717b;

}


/* =========================
   商品卡片
========================= */

.order-card {

    background: white;

    border-radius: 15px;

    padding: 18px;

    margin-bottom: 10px;

    box-shadow:
        0 4px 15px rgba(0,0,0,0.06);

}


.status {

    display: inline-block;

    padding: 5px 10px;

    border-radius: 8px;

    font-size: 13px;

    font-weight: bold;

    margin-bottom: 10px;

}


.status-arrived {

    background: #2d9253;

    color: white;

}


.status-waiting {

    background: #737e87;

    color: white;

}


.product-name {

    font-size: 18px;

    font-weight: bold;

}


.product-info {

    margin-top: 8px;

    color: #666;

    font-size: 14px;

    line-height: 1.8;

}


.price {

    text-align: right;

    font-size: 18px;

    font-weight: bold;

    margin-top: 10px;

}


/* =========================
   總金額
========================= */

.total-card {

    background: #202122;

    color: white;

    border-radius: 16px;

    padding: 20px;

    margin-top: 15px;

}


.total-row {

    display: flex;

    justify-content: space-between;

    padding: 10px 0;

    border-bottom:
        1px solid #444;

}


.total-row:last-child {

    border-bottom: none;

}


.total-number {

    font-size: 22px;

    font-weight: bold;

}


.grand-total {

    font-size: 28px;

    font-weight: bold;

}


/* =========================
   找不到
========================= */

.message {

    background: white;

    border-radius: 15px;

    padding: 25px;

    text-align: center;

    color: #777;

}


.footer {

    text-align: center;

    color: #999;

    font-size: 13px;

    margin-top: 30px;

    line-height: 1.7;

}

</style>

</head>


<body>


<div class="container">


<!-- =========================
     網站標題
========================= -->

<div class="header">

    <div class="logo">
        🦀
    </div>

    <h1>
        盤老板海鮮水產
    </h1>

    <div class="subtitle">
        線上訂單查詢
    </div>

</div>



<!-- =========================
     搜尋頁
========================= -->

<div id="searchPage">

    <div class="search-card">

        <div class="search-title">
            🔍 查詢我的訂單
        </div>

        <div class="search-description">

            請輸入您 LINE 社群內的暱稱
            <b> LINE 暱稱</b>。

            <br>

            系統會顯示符合的暱稱，
            請選擇您的帳號。<br>
            系統偶爾可能出錯或是未入單，<br>
            如有疑慮請私訊官方小編 @912macpp

        </div>


        <label>
            LINE 暱稱
        </label>


        <input
            id="searchInput"
            type="text"
            placeholder="例如：王"
            autocomplete="off"
        >


        <button onclick="searchCustomers()">

            🔍 搜尋

        </button>

    </div>


    <div id="searchResults"></div>

</div>



<!-- =========================
     訂單頁
========================= -->

<div id="orderPage">

    <button
        class="back-button"
        onclick="backToSearch()"
    >

        ← 返回搜尋

    </button>


    <div id="orderContent"></div>

</div>



<div class="footer">

    盤老板海鮮水產<br>

    訂單資料僅供查詢使用

</div>


</div>



<script>


/* ==================================================
   測試客戶資料

   目前先使用假資料。

   之後會換成飛比+1真正的資料。
================================================== */


const customers = [

    {
        id: "王小明",

        orders: [

            {
                product: "紅蟳",
                specification: "280g",
                quantity: 2,
                price: 280,
                status: "已到貨"
            },

            {
                product: "大草蝦",
                specification: "31/40",
                quantity: 2,
                price: 350,
                status: "已到貨"
            },

            {
                product: "北海道干貝",
                specification: "S級",
                quantity: 1,
                price: 650,
                status: "尚未到貨"
            }

        ]

    },


    {
        id: "王大明",

        orders: [

            {
                product: "白蝦",
                specification: "31/40",
                quantity: 2,
                price: 350,
                status: "已到貨"
            }

        ]

    },


    {
        id: "王小強",

        orders: [

            {
                product: "龍蝦",
                specification: "500g",
                quantity: 1,
                price: 980,
                status: "尚未到貨"
            }

        ]

    },


    {
        id: "陳小明",

        orders: [

            {
                product: "干貝",
                specification: "L級",
                quantity: 2,
                price: 600,
                status: "已到貨"
            }

        ]

    },


    {
        id: "小美",

        orders: [

            {
                product: "阿根廷紅蝦",
                specification: "2L",
                quantity: 1,
                price: 850,
                status: "尚未到貨"
            }

        ]

    }

];



/* ==================================================
   模糊搜尋客戶
================================================== */

function searchCustomers() {


    const keyword =
        document
        .getElementById("searchInput")
        .value
        .trim()
        .toLowerCase();


    const result =
        document
        .getElementById("searchResults");


    if (keyword === "") {

        result.innerHTML = `

            <div class="message">

                🔍 請輸入 LINE 暱稱

            </div>

        `;

        return;

    }


    /* 模糊搜尋 */

    const matched =
        customers.filter(function(customer) {

            return customer.id
                .toLowerCase()
                .includes(keyword);

        });


    /* 找不到 */

    if (matched.length === 0) {

        result.innerHTML = `

            <div class="message">

                😢 找不到相符的 LINE 暱稱

                <br><br>

                請確認輸入的暱稱是否正確。

            </div>

        `;

        return;

    }


    /* 顯示搜尋結果 */

    let html = `

        <div class="search-count">

            找到 ${matched.length} 個相符的 LINE 暱稱，
            請選擇：

        </div>

    `;


    matched.forEach(function(customer, index) {

        html += `

            <button
                class="customer-button"
                onclick="showOrders(${customers.indexOf(customer)})"
            >

                <span class="customer-icon">
                    👤
                </span>

                <span class="customer-id">
                    @${customer.id}
                </span>

            </button>

        `;

    });


    result.innerHTML = html;

}



/* ==================================================
   顯示客戶訂單
================================================== */

function showOrders(index) {


    const customer =
        customers[index];


    document
        .getElementById("searchPage")
        .style.display = "none";


    document
        .getElementById("orderPage")
        .style.display = "block";


    let arrivedTotal = 0;

    let waitingTotal = 0;

    let arrivedCount = 0;

    let waitingCount = 0;


    let html = `

        <div class="customer-header">

            <div class="customer-header-title">

                📌 查詢 ID：@${customer.id}

            </div>

            <div class="customer-header-subtitle">

                以下為您的訂購商品

            </div>

        </div>

    `;


    /* =========================
       已到貨
    ========================= */

    const arrivedOrders =
        customer.orders.filter(function(order) {

            return order.status === "已到貨";

        });


    if (arrivedOrders.length > 0) {


        html += `

            <div class="section-title arrived-title">

                📦 已到貨商品

            </div>

        `;


        arrivedOrders.forEach(function(order) {


            const subtotal =
                order.quantity *
                order.price;


            arrivedTotal += subtotal;

            arrivedCount += order.quantity;


            html += createOrderCard(
                order,
                subtotal,
                true
            );

        });

    }



    /* =========================
       尚未到貨
    ========================= */

    const waitingOrders =
        customer.orders.filter(function(order) {

            return order.status !== "已到貨";

        });


    if (waitingOrders.length > 0) {


        html += `

            <div class="section-title waiting-title">

                📅 未到貨商品

            </div>

        `;


        waitingOrders.forEach(function(order) {


            const subtotal =
                order.quantity *
                order.price;


            waitingTotal += subtotal;

            waitingCount += order.quantity;


            html += createOrderCard(
                order,
                subtotal,
                false
            );

        });

    }



    /* =========================
       金額統計
    ========================= */

    const grandTotal =
        arrivedTotal +
        waitingTotal;


    html += `

        <div class="total-card">

            <div class="total-row">

                <div>

                    已到貨合計

                    <br>

                    <small>
                        ${arrivedOrders.length}
                        項商品 /
                        ${arrivedCount}
                        件
                    </small>

                </div>

                <div class="total-number">

                    $${arrivedTotal.toLocaleString()}

                </div>

            </div>


            <div class="total-row">

                <div>

                    未到貨合計

                    <br>

                    <small>
                        ${waitingOrders.length}
                        項商品 /
                        ${waitingCount}
                        件
                    </small>

                </div>

                <div>

                    $${waitingTotal.toLocaleString()}

                </div>

            </div>


            <div class="total-row">

                <div>

                    <b>總金額</b>

                </div>

                <div class="grand-total">

                    $${grandTotal.toLocaleString()}

                </div>

            </div>

        </div>

    `;


    document
        .getElementById("orderContent")
        .innerHTML = html;

}



/* ==================================================
   商品卡片
================================================== */

function createOrderCard(
    order,
    subtotal,
    arrived
) {


    const statusClass =
        arrived
        ? "status-arrived"
        : "status-waiting";


    return `

        <div class="order-card">

            <span
                class="status ${statusClass}"
            >

                ${order.status}

            </span>


            <div class="product-name">

                ${order.product}

            </div>


            <div class="product-info">

                規格：
                ${order.specification}

                <br>

                單價：
                $${order.price.toLocaleString()}

                |

                數量：
                ${order.quantity}

            </div>


            <div class="price">

                $${subtotal.toLocaleString()}

            </div>

        </div>

    `;

}



/* ==================================================
   返回搜尋
================================================== */

function backToSearch() {


    document
        .getElementById("orderPage")
        .style.display = "none";


    document
        .getElementById("searchPage")
        .style.display = "block";

}


</script>


</body>

</html>
