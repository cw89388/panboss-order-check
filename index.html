<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102c35">
<title>盤老板海鮮水產｜訂單查詢</title>
<style>
:root{--ink:#18343a;--muted:#718087;--sea:#123943;--sea2:#1c5960;--gold:#d8a84e;--paper:#f3f6f4;--line:#e5ece9;--green:#21845b;--red:#a86a34}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif}
.wrap{max-width:620px;margin:auto;padding:20px 16px 48px}.hero{text-align:center;padding:25px 8px 23px}.mark{width:66px;height:66px;margin:auto;border-radius:22px;background:linear-gradient(145deg,#174b55,#0d3039);display:grid;place-items:center;color:#fff;font-size:34px;box-shadow:0 10px 24px #153f4930}.brand{font-size:25px;font-weight:850;letter-spacing:1px;margin:13px 0 4px}.sub{color:var(--muted);font-size:14px;letter-spacing:2px}
.panel,.customer,.order,.totals,.empty{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 24px #173b430a}.panel{padding:22px}.panel h2{font-size:19px;margin:0 0 7px}.hint{font-size:14px;line-height:1.7;color:var(--muted);margin:0 0 18px}.field{display:block;font-size:14px;font-weight:750;margin-bottom:8px}.searchrow{display:flex;gap:9px}input{min-width:0;flex:1;padding:15px 14px;border:1px solid #d8e1de;border-radius:12px;font-size:16px;outline:none}input:focus{border-color:var(--sea2);box-shadow:0 0 0 3px #1c596018}button{font:inherit;cursor:pointer}.searchbtn{border:0;border-radius:12px;padding:0 19px;background:var(--sea);color:#fff;font-weight:750}.statusline{font-size:12px;color:var(--muted);text-align:center;margin:13px 0 0}.results{margin-top:16px}.count{font-size:13px;color:var(--muted);margin:0 0 9px}.customer{width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left;padding:17px 18px;margin:0 0 9px;color:var(--ink)}.customer strong{font-size:17px}.customer span{color:var(--muted);font-size:13px}.customer .arrow{font-size:20px;color:var(--gold)}
#detail{display:none;margin-top:16px}.back{border:0;background:transparent;color:var(--sea2);font-weight:750;padding:8px 0 14px}.profile{background:var(--sea);color:#fff;border-radius:18px;padding:20px;margin-bottom:14px}.profile small{color:#c8d8d8}.profile strong{display:block;font-size:21px;margin:5px 0}.section{font-size:15px;font-weight:850;padding:12px 14px;border-radius:12px;margin:16px 0 9px}.arrived{background:#e6f4ec;color:#176b48}.waiting{background:#edf1f2;color:#52646b}.order{padding:16px;margin-bottom:9px}.tag{display:inline-block;border-radius:7px;padding:4px 8px;font-size:12px;font-weight:750;margin-bottom:9px}.tag.ok{background:#e3f3ea;color:#176b48}.tag.pending{background:#edf1f2;color:#586970}.pname{font-size:17px;font-weight:800;line-height:1.4}.meta{font-size:13px;line-height:1.8;color:var(--muted);margin-top:7px}.amount{text-align:right;font-size:18px;font-weight:850;margin-top:8px}.totals{padding:17px;margin-top:14px;background:#123943;color:#fff;border:0}.sumrow{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #ffffff25;font-size:14px}.sumrow:last-child{border:0}.sumrow b{font-size:18px}.sumrow.total b{font-size:25px;color:#f3cf83}.empty{text-align:center;padding:23px;color:var(--muted);line-height:1.7}.notice{font-size:12px;color:#8b989b;text-align:center;line-height:1.7;margin:25px 8px 0}.error{color:#9c4b32}.hidden{display:none!important}@media(max-width:420px){.wrap{padding:12px 12px 36px}.panel{padding:18px}.searchrow{flex-direction:column}.searchbtn{padding:14px}}
</style>
</head>
<body>
<main class="wrap">
<header class="hero"><div class="mark">🦀</div><div class="brand">盤老板海鮮水產</div><div class="sub">線上訂單查詢</div></header>
<section id="searchView" class="panel">
<h2>查詢我的訂單</h2>
<p class="hint">請輸入您在 LINE 社群使用的暱稱。若出現多筆相近名稱，請選擇自己的暱稱查看訂單。</p>
<label class="field" for="keyword">LINE 社群暱稱</label>
<div class="searchrow"><input id="keyword" autocomplete="off" placeholder="請輸入 LINE 暱稱"><button class="searchbtn" id="searchBtn">搜尋訂單</button></div>
<div id="loadStatus" class="statusline">正在連線讀取最新訂單資料…</div>
</section>
<section id="results" class="results"></section>
<section id="detail"><button id="backBtn" class="back">← 返回搜尋</button><div id="detailContent"></div></section>
<footer class="notice">盤老板海鮮水產｜訂單資料僅供本人核對<br>如資料有疑問，請私訊官方 LINE：@912macpp<br>此查詢目前採公開暱稱搜尋，請勿輸入或公開他人個資。</footer>
</main>
<script>
/*
 * Google Sheets CSV 設定：
 * 1. 將飛比匯出的 Excel 匯入 Google 試算表。
 * 2. 將訂單資料工作表發布為 CSV。
 * 3. 把下方 CSV_URL 換成該工作表的發布 CSV 網址。
 *
 * 欄位順序（第一列為標題）：
 * LINE暱稱,商品名稱,規格,訂購數量,已到貨數量,單價,狀態
 */
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSoWiY3VB1WaQj5AWN9R_ThsyXVHlJKR_8uYX6sA8FrVnUh2f48df7KPXjlwmDI5F_9i2OzjqkkXawI/pub?output=csv";
let customers = [];
const $ = id => document.getElementById(id);
const money = n => "$" + Number(n || 0).toLocaleString("zh-TW");
const esc = value => String(value ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function parseCSV(text){
  const rows=[];let row=[],cell="",quoted=false;
  for(let i=0;i<text.length;i++){
    const c=text[i],next=text[i+1];
    if(c==='"' && quoted && next==='"'){cell+='"';i++;}
    else if(c==='"'){quoted=!quoted;}
    else if(c===',' && !quoted){row.push(cell);cell="";}
    else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&next==='\n')i++;row.push(cell);if(row.some(v=>v.trim()!==""))rows.push(row);row=[];cell="";}
    else cell+=c;
  }
  row.push(cell);if(row.some(v=>v.trim()!==""))rows.push(row);
  return rows;
}
function norm(s){return String(s??"").trim().replace(/\s+/g,"").toLowerCase();}
function findCol(headers, candidates, fallback){const h=headers.map(norm);for(const name of candidates){const i=h.indexOf(norm(name));if(i>=0)return i;}return fallback;}
function num(v){const n=Number(String(v??"").replace(/[$,，\s]/g,""));return Number.isFinite(n)?n:0;}
function normalizeRows(rows){
  if(rows.length<2)throw new Error("試算表沒有可讀取的訂單資料");
  const h=rows[0];
  const col={
    name:findCol(h,["LINE暱稱","客戶暱稱","暱稱","客戶名稱"],0),
    product:findCol(h,["商品名稱","商品","品名"],1),
    spec:findCol(h,["規格","商品規格"],2),
    qty:findCol(h,["訂購數量","數量","訂購量"],3),
    arrived:findCol(h,["已到貨數量","到貨數量","已到貨"],4),
    price:findCol(h,["單價","售價"],5),
    status:findCol(h,["狀態","訂單狀態","到貨狀態"],6),
    paid:findCol(h,["付款狀態","付款"],-1)
  };
  const map=new Map();
  rows.slice(1).forEach(r=>{
    const id=String(r[col.name]??"").trim();
    if(!id)return;
    const quantity=num(r[col.qty]),price=num(r[col.price]);
    const rawStatus=String(r[col.status]??"").trim();
    const isArrived=/已到貨|到貨/.test(rawStatus);
    const arrivedQuantity=col.arrived>=0 && String(r[col.arrived]??"").trim()!=="" ? num(r[col.arrived]) : (isArrived?quantity:0);
    const order={product:String(r[col.product]??"").trim(),specification:String(r[col.spec]??"").trim(),quantity,arrivedQuantity:Math.max(0,Math.min(quantity,arrivedQuantity)),price,status:rawStatus|| (arrivedQuantity>=quantity?"已到貨":"未到貨"),payment:col.paid>=0?String(r[col.paid]??"").trim():""};
    if(!map.has(id))map.set(id,{id,orders:[]});
    map.get(id).orders.push(order);
  });
  return [...map.values()];
}
async function loadCustomers(){
  try{
    const response=await fetch(CSV_URL,{cache:"no-store"});
    if(!response.ok)throw new Error("Google 試算表讀取失敗（"+response.status+"）");
    const csv=await response.text();
    customers=normalizeRows(parseCSV(csv));
    $("loadStatus").textContent="資料已更新｜共 "+customers.length.toLocaleString()+" 位客戶";
    $("loadStatus").classList.remove("error");
  }catch(err){
    $("loadStatus").textContent="目前無法讀取訂單資料，請稍後再試。";
    $("loadStatus").classList.add("error");
    $("results").innerHTML='<div class="empty error">'+esc(err.message)+"<br>請確認 Google 試算表已發布為 CSV，且欄位格式正確。</div>";
  }
}
function search(){
  const key=$("keyword").value.trim();
  if(!key){$("results").innerHTML='<div class="empty">請先輸入 LINE 社群暱稱</div>';return;}
  if(!customers.length){$("results").innerHTML='<div class="empty">訂單資料尚未載入，請稍後再試。</div>';return;}
  const matches=customers.filter(c=>c.id.toLocaleLowerCase().includes(key.toLocaleLowerCase()));
  if(!matches.length){$("results").innerHTML='<div class="empty">找不到相符的暱稱<br>請確認輸入內容是否正確。</div>';return;}
  $("results").innerHTML='<p class="count">找到 '+matches.length+' 筆相符暱稱，請選擇您的帳號：</p>'+matches.map(c=>'<button class="customer" data-id="'+esc(c.id)+'"><strong>👤 '+esc(c.id)+'</strong><span>查看訂單 <b class="arrow">›</b></span></button>').join("");
  $("results").querySelectorAll(".customer").forEach(btn=>btn.addEventListener("click",()=>showOrders(btn.dataset.id)));
}
function showOrders(id){
  const customer=customers.find(c=>c.id===id);if(!customer)return;
  const arrived=customer.orders.map(o=>({...o,qty:o.arrivedQuantity})).filter(o=>o.qty>0);
  const waiting=customer.orders.map(o=>({...o,qty:Math.max(0,o.quantity-o.arrivedQuantity)})).filter(o=>o.qty>0);
  const arrivedTotal=arrived.reduce((s,o)=>s+o.qty*o.price,0);
  const waitingTotal=waiting.reduce((s,o)=>s+o.qty*o.price,0);
  const cards=(items,isArrived)=>items.map(o=>'<article class="order"><span class="tag '+(isArrived?'ok':'pending')+'">'+(isArrived?'已到貨':'未到貨')+'</span><div class="pname">'+esc(o.product)+'</div><div class="meta">規格：'+esc(o.specification||"—")+'<br>單價：'+money(o.price)+'　｜　數量：'+o.qty+' 件'+(o.payment?'<br>付款狀態：'+esc(o.payment):"")+'</div><div class="amount">'+money(o.qty*o.price)+'</div></article>').join("");
  $("detailContent").innerHTML='<div class="profile"><small>查詢 LINE 暱稱</small><strong>'+esc(customer.id)+'</strong><small>以下為目前匯入的訂單明細</small></div>'+(arrived.length?'<div class="section arrived">📦 已到貨商品</div>'+cards(arrived,true):"")+(waiting.length?'<div class="section waiting">⏳ 尚未到貨商品</div>'+cards(waiting,false):"")+'<div class="totals"><div class="sumrow"><span>已到貨金額</span><b>'+money(arrivedTotal)+'</b></div><div class="sumrow"><span>未到貨金額</span><b>'+money(waitingTotal)+'</b></div><div class="sumrow total"><span>目前訂單總額</span><b>'+money(arrivedTotal+waitingTotal)+'</b></div></div>';
  $("searchView").classList.add("hidden");$("results").classList.add("hidden");$("detail").style.display="block";window.scrollTo({top:0,behavior:"smooth"});
}
function back(){ $("detail").style.display="none";$("searchView").classList.remove("hidden");$("results").classList.remove("hidden");$("detailContent").innerHTML=""; }
$("searchBtn").addEventListener("click",search);
$("keyword").addEventListener("keydown",e=>{if(e.key==="Enter")search();});
$("backBtn").addEventListener("click",back);
loadCustomers();
</script>
</body>
</html>
